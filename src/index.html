<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        body{
            background: #0B0F19;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            min-height: 100vh;
            flex-direction: column;
            font-family: system-ui, sans-serif;
        }
        #s{
            appearance: none;
            width: 160px;
            height: 5px;
            border-radius: 5px;
            background: #555;
        }
        #s::-webkit-slider-thumb{
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
        }
    </style>
</head>
<body>
    <canvas id="c" width="1000" height="600"></canvas>
    <input type="range" id="s" min="1" max="20" value="8">
    <h2>Click grey circle to Start</h2>
    
    <script>
        const c = document.querySelector("#c")
        const s = document.querySelector("#s")
        const x = c.getContext("2d")
        const audio = new AudioContext()
        let speed = 0.08
        let playing = false
        const buttons = [
            {x:800, y: 150, color: "#ff6961"},
            {x:800, y: 250, color: "#77dd77"},
            {x:800, y: 350, color: "#1b85b8"},
            {x:800, y: 450, color: "#aec6cf"},
        ]
        
        let circles = [
            [[0, 40], 60, "#ff6961", 440],
            [[10], 100, "#77dd77", 523.25],
            [[20], 140, "#1b85b8", 659.25]
        ]

        function playNote(freq){
            let osc = audio.createOscillator()
            let gain = audio.createGain()
            
            osc.frequency.value = freq
            osc.type = "sine"
            gain.gain.value = .1
            osc.connect(gain).connect(audio.destination)
            
            osc.start()
            osc.stop(audio.currentTime + .1)
        }
        
        function animate(){
            x.clearRect(0, 0, c.width, c.height)
            for(let i=0; i < 3; i++){
                x.lineWidth = 5
                x.strokeStyle = "white";
                x.beginPath()
                x.arc(500, 300, (60 + 40 * i), Math.PI, 3 * Math.PI)
                x.stroke()
            }
            
            x.strokeStyle="grey"
            x.beginPath()
            x.moveTo(320, 300)
            x.lineTo(480, 300)
            x.stroke()
            
            for(let i=0; i<3; i++){
                circles[i][0].forEach((b,j)=>{
                    const m = 500 + circles[i][1] * Math.cos(b)
                    const n = 300 + circles[i][1] * Math.sin(b)
                    
                    x.fillStyle=circles[i][2];
                    x.beginPath()
                    x.arc(m, n, 10, 0, Math.PI * 2)
                    x.fill()
                    let oldB = circles[i][0][j]
                    if(playing){
                        circles[i][0][j] += speed
                    }
                    let newB = circles[i][0][j]

                    if(oldB<Math.PI && newB>=Math.PI){
                        playNote(circles[i][3])
                    }
                    if(newB>=Math.PI*2)circles[i][0][j] -= Math.PI*2
                })
            }
            
            buttons.forEach(b=>{
                x.fillStyle=b.color;
                x.beginPath()
                x.arc(b.x, b.y, 20, 0, Math.PI * 2)
                x.fill()
            })
            
            
            requestAnimationFrame(animate)
            
        }
        c.onclick=e=>{
            audio.resume()
            const m=e.offsetX
            const n=e.offsetY

            for(let i=0; i<3; i++){
                circles[i][0].forEach((b,j)=>{
                    if(Math.hypot(m-(500 + circles[i][1] * Math.cos(b)), n-(300 + circles[i][1] * Math.sin(b))) < 10){
                        circles[i][0].splice(j, 1)
                        j--
                    }
                })
            }

            buttons.forEach((b,j)=>{
                if(Math.hypot(m-b.x, n-b.y)<20){
                    if(b.y == 450){
                        playing = !playing
                    } else{
                        circles[j][0].push(Math.PI)
                    }
                }
            })
        }

        s.oninput=e=>{speed=e.target.value/100}

        animate()
    </script>
</body>
</html>
