<!DOCTYPE html>
<head>
    <title>Document</title>
</head>
<body style="background: #0B0F19;display: flex;justify-content: center; align-items: center; color: white; min-height: 100vh; flex-direction: column;">
    <canvas id="c" width="1000" height="600"></canvas>
    <h2>Tempo: 12</h2>

    <script>
        const c = document.querySelector("#c")
        const x = c.getContext("2d")
        let speed = 0.01
        let playing = true
        const buttons = [
            {x:800, y: 150, color: "red"},
            {x:800, y: 250, color: "green"},
            {x:800, y: 350, color: "blue"},
            {x:800, y: 450, color: "grey"},
        ]

        let circles = [
            [[0], 60, "red"],
            [[10], 100, "green"],
            [[3], 140, "blue"]
        ]


        function animate(){
            x.clearRect(0, 0, c.width, c.height)
            for(let i=0; i < 3; i++){
                x.lineWidth = 5
                x.strokeStyle = "white";
                x.beginPath()
                x.arc(500, 300, (60 + 40 * i), Math.PI, 3 * Math.PI)
                x.stroke()
            }

            x.strokeStyle="grey"
            x.beginPath()
            x.moveTo(320, 300)
            x.lineTo(480, 300)
            x.stroke()
            
            for(let i=0; i<3; i++){
                circles[i][0].forEach((b,j)=>{
                    const m = 500 + circles[i][1] * Math.cos(b)
                    const n = 300 + circles[i][1] * Math.sin(b)

                    x.fillStyle=circles[i][2];
                    x.beginPath()
                    x.arc(m, n, 8, 0, Math.PI * 2)
                    x.fill()
                    if(playing){
                        circles[i][0][j] += speed
                    }
                    
                })
            }

            buttons.forEach(b=>{
                x.fillStyle=b.color;
                x.beginPath()
                x.arc(b.x, b.y, 20, 0, Math.PI * 2)
                x.fill()
            })

            c.onclick=e=>{
                const m=e.offsetX
                const n=e.offsetY

                console.log(m, n)

                buttons.forEach((b,j)=>{
                    if(Math.hypot(m-b.x, n-b.y)<20){
                        if(b.y == 450){
                            playing = !playing
                        } else{
                            circles[j][0].push(0)
                        }
                    }
                })
            }

            requestAnimationFrame(animate)

        }

        animate()
    </script>
</body>
</html>
