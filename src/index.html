<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        body{
            background: #0B0F19;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            min-height: 100vh;
            flex-direction: column;
            font-family: system-ui, sans-serif;
        }
        #s{
            appearance: none;
            width: 160px;
            height: 5px;
            border-radius: 5px;
            background: #555;
        }
        #s::-webkit-slider-thumb{
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
        }
    </style>
</head>
<body>
    <canvas id="c" width="1000" height="600"></canvas>
    <input type="range" id="s" min="1" max="20" value="8">
    <h2>Click grey circle to Start</h2>
    
    <script>
        const c = document.querySelector("#c")
        const s = document.querySelector("#s")
        const x = c.getContext("2d")
        const audio = new AudioContext()
        let speed = 0.08
        let playing = false
        const button = {x:800, y: 300, color: "#aec6cf"}
        
        let circles = [
            [[0, 40], 60, "#ff6961", 0],
            [[10], 100, "#77dd77", 1],
            [[20], 140, "#1b85b8", 2]
        ]

        function playNote(t){
            let o = audio.createOscillator()
            let g = audio.createGain()
            
            if(t==0){
                o.frequency.value = 150
                o.frequency.exponentialRampToValueAtTime(40, audio.currentTime+.1)
            }else{o.frequency.value=t==1?180:300}

            g.gain.value = .15
            o.connect(g).connect(audio.destination)
            
            o.start()
            o.stop(audio.currentTime + .1)
        }
        
        function animate(){
            x.clearRect(0, 0, c.width, c.height)
            for(let i=0; i < 3; i++){
                x.lineWidth = 5
                x.strokeStyle = "white";
                x.beginPath()
                x.arc(500, 300, (60 + 40 * i), Math.PI, 3 * Math.PI)
                x.stroke()
            }
            
            x.strokeStyle="grey"
            x.beginPath()
            x.moveTo(320, 300)
            x.lineTo(480, 300)
            x.stroke()
            
            for(let i=0; i<3; i++){
                circles[i][0].forEach((b,j)=>{
                    const m = 500 + circles[i][1] * Math.cos(b)
                    const n = 300 + circles[i][1] * Math.sin(b)
                    
                    x.fillStyle=circles[i][2];
                    x.beginPath()
                    x.arc(m, n, 10, 0, Math.PI * 2)
                    x.fill()
                    let oldB = circles[i][0][j]
                    if(playing){
                        circles[i][0][j] += speed
                    }
                    let newB = circles[i][0][j]

                    if(oldB<Math.PI && newB>=Math.PI){
                        playNote(circles[i][3])
                    }
                    if(newB>=Math.PI*2)circles[i][0][j] -= Math.PI*2
                })
            }

            x.fillStyle=button.color;
            x.beginPath()
            x.arc(button.x, button.y, 20, 0, Math.PI * 2)
            x.fill()
            
            
            requestAnimationFrame(animate)
            
        }
        c.onclick=e=>{
            audio.resume()
            let m=e.offsetX
            let n=e.offsetY
            let b = Math.atan2(n-300, m-500)
            if(b<0){
                b+=Math.PI * 2
            }

            for(let i=0; i<3; i++){
                for(let j=0; j<circles[i][0].length;j++){
                    let a = circles[i][0][j]
                    if(Math.hypot(m-(500 + circles[i][1] * Math.cos(a)), n-(300 + circles[i][1] * Math.sin(a))) < 10){
                        circles[i][0].splice(j, 1)
                        return
                    }
                }
                
                if(Math.abs(Math.hypot(m-500,n-300)-(60 + 40*i)) < 10){
                    circles[i][0].push(b)
                    return
                }
            }

            if(Math.hypot(m-button.x, n-button.y)<20){
                playing=!playing
            }

        }

        s.oninput=e=>{speed=e.target.value/100}

        animate()
    </script>
</body>
</html>
