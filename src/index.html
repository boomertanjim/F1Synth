<!DOCTYPE html>
<head>
    <title>Document</title>
</head>
<body style="background: #0B0F19;display: flex;justify-content: center; align-items: center; color: white; height: 100vh;">
    <canvas id="c" width="600" height="400"></canvas>

    <script>
        const c = document.querySelector("#c")
        const x = c.getContext("2d")

        x.beginPath()
        x.ellipse(300, 200, 200, 100, 0, 0, Math.PI*2)
        x.stroke()
    </script>
</body>
</html>
